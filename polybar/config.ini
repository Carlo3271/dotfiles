[colors]
background = #111312
background-alt = #20211d
foreground = #eee8c8
muted = #8e8a7b
accent = #d8d099
green = #9ba66d
yellow = #d8d099
red = #d36b62
teal = #79a5a0

[bar/top]
monitor = ${env:MONITOR:}
width = 100%
height = 32
offset-x = 0
offset-y = 0
bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.accent}
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = Noto Sans:size=10;2
font-1 = MesloLGS Nerd Font Mono:size=10;2
font-2 = Noto Color Emoji:scale=10;2

modules-left = menu xworkspaces
modules-center = date
modules-right = xwindow pulseaudio cpu memory

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = generic
override-redirect = false

[module/menu]
type = custom/text
content = VOID
content-background = ${colors.accent}
content-foreground = #111312
content-padding = 2
click-left = rofi -show drun

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-foreground = ${colors.accent}
label-active-underline = ${colors.accent}
label-active-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = #111318
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:70:...%
label-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = VOL <label-volume>
format-volume-foreground = ${colors.teal}
label-volume = %percentage%%

label-muted = MUTED
label-muted-foreground = ${colors.red}

[module/cpu]
type = internal/cpu
interval = 2
format = CPU <label>
format-foreground = ${colors.yellow}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format = RAM <label>
format-foreground = ${colors.accent}
label = %percentage_used%%
