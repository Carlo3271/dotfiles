backend = "glx";
vsync = true;
use-damage = true;

shadow = false;
fading = false;
blur-method = "none";

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;
unredir-if-possible = true;

opacity-rule = [
  "84:class_g = 'WebcoreFetch'",
  "82:class_g = 'CMatrixDash'",
  "86:class_g = 'HtopDash'"
];
